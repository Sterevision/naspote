# /etc/nginx/sites-available/kartometr.ru
# Скопируйте в /etc/nginx/sites-enabled/ и выполните: sudo nginx -t && sudo systemctl reload nginx

upstream kartometr_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Редирект с www на без www (или наоборот — выберите нужный вариант)
server {
    listen 80;
    listen [::]:80;
    server_name www.kartometr.ru;
    return 301 https://kartometr.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kartometr.ru;

    # Редирект на HTTPS (включите после получения SSL-сертификата)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kartometr.ru;

    # SSL (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/kartometr.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kartometr.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (раскомментируйте после подтверждения работы HTTPS)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Логирование
    access_log /var/log/nginx/kartometr.access.log;
    error_log /var/log/nginx/kartometr.error.log warn;

    # Лимит тела запроса (загрузка файлов)
    client_max_body_size 25M;

    # Таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Проксирование к Gunicorn
    location / {
        proxy_pass http://kartometr_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Статика Flask (если не выносите отдельно)
    location /static/ {
        proxy_pass http://kartometr_app;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Запрет доступа к .env
    location ~ /\.env {
        deny all;
    }
}