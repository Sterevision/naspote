{% extends "base.html" %}
{% block title %}Вход — Картометр{% endblock %}
{% block content %}
<div class="center-page">
    <div class="auth-box card">
        <div class="logo-circle">👋</div>
        <h1 class="display" style="text-align:center;font-size:26px;">С возвращением</h1>
        <form method="POST" style="margin-top:24px;">
            <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
            <div class="field"><label>Пароль</label><input type="password" name="password" required autocomplete="current-password"></div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
        <p class="switch-link">Ещё нет аккаунта? <a href="{{ url_for('register') }}">Создать</a></p>
    </div>
</div>
{% endblock %}
