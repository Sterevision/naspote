{% extends "base.html" %}

{% block title %}Вход — Картометр{% endblock %}

{% block content %}
<div class="center-page">
    <div class="auth-box card">
        <div class="logo-circle">
            👋
        </div>

        <h1 class="display" style="text-align:center; font-size:24px; margin-bottom:10px;">
            С возвращением
        </h1>

        <p class="subtitle" style="text-align:center; margin-bottom:24px;">
            Войдите, чтобы увидеть карту живого города
        </p>

        <form method="post" action="{{ url_for('login') }}">
            <div class="field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Пароль</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="btn btn-primary btn-block" type="submit">
                Войти
            </button>
        </form>

        <div class="switch-link">
            Ещё нет аккаунта?
            <a href="{{ url_for('register') }}">Создать</a>
        </div>
    </div>
</div>
{% endblock %}
