{% extends "base.html" %}
{% block title %}Карта — На споте{% endblock %}
{% block content %}
<div class="app-shell">
    <div class="map-wrap">
        <div id="map"></div>
        <button class="big-add" id="openAddSpot" title="Оставить метку">+</button>
    </div>
    <nav class="bottom-nav">
        <a href="{{ url_for('map_view') }}" class="nav-item active"><span class="ic">🗺️</span>Карта</a>
        <a href="{{ url_for('feed_view') }}" class="nav-item"><span class="ic">📰</span>Лента</a>
        <a href="{{ url_for('friends_view') }}" class="nav-item"><span class="ic">🤝</span>Друзья</a>
        <a href="{{ url_for('profile_view', username=profile.username) }}" class="nav-item"><span class="ic">👤</span>Профиль</a>
    </nav>
</div>

<div id="addSpotOverlay" class="sheet-overlay">
    <div class="sheet">
        <button class="sheet-close" id="closeSheet">✕</button>
        <h3>📍 Новая метка</h3>
        <form id="addSpotForm">
            <input type="hidden" id="latInput" name="lat">
            <input type="hidden" id="lngInput" name="lng">
            <div class="field"><label>Что тут происходит?</label>
                <input type="text" name="title" placeholder="Например: пью кофе с друзьями" required></div>
            <div class="field"><label>Пара слов (необязательно)</label>
                <textarea name="description" placeholder="Расскажи, как тут"></textarea></div>
            <div class="field"><label>Сколько метка будет на карте?</label>
                <div class="duration-toggle">
                    <div class="duration-option" data-h="1">1 час</div>
                    <div class="duration-option selected" data-h="3">3 часа</div>
                    <div class="duration-option" data-h="6">6 часов</div>
                    <div class="duration-option" data-h="24">сутки</div>
                </div>
                <input type="hidden" id="durationInput" name="duration_hours" value="3"></div>
            <div class="field"><label>Настроение</label>
                <div class="mood-row">
                    <div class="mood-chip" data-mood="🎉 Весело">🎉 Весело</div>
                    <div class="mood-chip" data-mood="☕ Спокойно">☕ Спокойно</div>
                    <div class="mood-chip" data-mood="🌿 Природа">🌿 Природа</div>
                    <div class="mood-chip" data-mood="⚡ Движ">⚡ Движ</div>
                </div>
                <input type="hidden" id="moodInput" name="mood"></div>
            <div class="field"><label>Кто увидит метку?</label>
                <div class="visibility-toggle">
                    <div class="vis-option selected" data-vis="public">🌍 Все</div>
                    <div class="vis-option" data-vis="friends">🤝 Только друзья</div>
                </div>
                <input type="hidden" id="visibilityInput" name="visibility" value="public"></div>
            <div class="field"><label>Фото (необязательно)</label>
                <input type="file" name="photo" accept="image/*"></div>
            <button type="submit" class="btn btn-primary btn-block">Поставить метку</button>
        </form>
    </div>
</div>

<div id="spotSheetOverlay" class="sheet-overlay">
    <div class="sheet" id="spotSheetContent"></div>
</div>

<script>window.CURRENT_USER_ID = "{{ profile.id }}";</script>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/map.js') }}?v=3"></script>
{% endblock %}
