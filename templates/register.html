{% extends "base.html" %}
{% block title %}Регистрация — На споте{% endblock %}
{% block content %}
<div class="center-page">
    <div class="auth-box card">
        <div class="logo-circle">🌱</div>
        <h1 class="display" style="text-align:center;">Создать профиль</h1>
        <form method="POST" style="margin-top:24px;">
            <div class="field">
                <label>Кто вы?</label>
                <div class="visibility-toggle">
                    <div class="vis-option selected" onclick="pickType(this,'person')">🙋 Человек</div>
                    <div class="vis-option" onclick="pickType(this,'organization')">🏢 Заведение</div>
                </div>
                <input type="hidden" id="accountTypeInput" name="account_type" value="person">
            </div>
            <div class="field"><label>Ваше имя</label><input type="text" name="display_name" placeholder="Например: Мария" required></div>
            <div class="field"><label>Имя пользователя (латиницей)</label><input type="text" name="username" placeholder="Например: maria" required></div>
            <div class="field"><label>Email</label><input type="email" name="email" required></div>
            <div class="field"><label>Пароль</label><input type="password" name="password" required></div>
            <button type="submit" class="btn btn-green btn-block">Зарегистрироваться</button>
        </form>
        <p class="switch-link">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
    </div>
</div>
<script>
function pickType(el, type) {
    document.querySelectorAll('.vis-option').forEach(function(o){o.classList.remove('selected');});
    el.classList.add('selected');
    document.getElementById('accountTypeInput').value = type;
}
</script>
{% endblock %}
