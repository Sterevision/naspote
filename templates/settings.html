{% extends "base.html" %}
{% block title %}Настройки — На споте{% endblock %}
{% block content %}
<div class="profile-shell">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
        <a href="{{ url_for('profile_view', username=profile.username) }}" class="btn btn-ghost btn-sm">← Готово</a>
        <h2 class="display" style="margin:0;font-size:24px;">Настройки профиля</h2>
    </div>
    
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="form_name" value="profile">
        
        <div class="field">
            <label>Отображаемое имя</label>
            <input type="text" name="display_name" value="{{ profile.display_name }}">
        </div>
        
        <div class="field">
            <label>Место обитания</label>
            <input type="text" name="location" value="{{ profile.location or '' }}" placeholder="Например: Москва">
        </div>
        
        <div class="field">
            <label>Возраст</label>
            <input type="number" name="age" value="{{ profile.age or '' }}" min="14" max="100">
        </div>
        
        <div class="field">
            <label>О себе</label>
            <textarea name="bio">{{ profile.bio or '' }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Сохранить изменения</button>
    </form>
    
    <div class="section-divider"></div>
    
    <h3 class="settings-subtitle">Внешний вид</h3>
    <div class="checkbox-row master-toggle" onclick="toggleTheme()" style="cursor:pointer;">
        <span id="themeIcon">🌙</span>
        <span id="themeText">Тёмная тема</span>
    </div>
    
    <div class="section-divider"></div>
    <a href="{{ url_for('logout') }}" class="btn btn-ghost btn-block" style="color:var(--pink);border-color:var(--pink);">🚪 Выйти из аккаунта</a>
</div>

<script>
function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.getElementById('themeIcon').textContent = next === 'light' ? '☀️' : '🌙';
    document.getElementById('themeText').textContent = next === 'light' ? 'Светлая тема' : 'Тёмная тема';
}
// Инициализация при загрузке
const saved = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', saved);
document.getElementById('themeIcon').textContent = saved === 'light' ? '☀️' : '🌙';
document.getElementById('themeText').textContent = saved === 'light' ? 'Светлая тема' : 'Тёмная тема';
</script>
{% endblock %}
