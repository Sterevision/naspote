{% extends "base.html" %}
{% block title %}Настройки — На споте{% endblock %}
{% block content %}
<div class="profile-shell">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <a href="{{ url_for('profile_view', username=profile.username) }}" class="btn btn-ghost btn-sm">← Готово</a>
    </div>
    
    <h2 class="display" style="margin-bottom:24px;">Настройки профиля</h2>
    
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="form_name" value="profile">
        <input type="hidden" name="account_type" value="{{ profile.account_type }}">
        
        <div class="avatar-upload-row">
            <div class="avatar-preview" {% if profile.avatar_url %}style="background-image:url({{ profile.avatar_url }});"{% endif %}>
                {% if not profile.avatar_url %}{{ profile.display_name[:1]|upper }}{% endif %}
            </div>
            <div>
                <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
                    📷 Сменить фото
                    <input type="file" name="avatar" accept="image/*" style="display:none;">
                </label>
            </div>
        </div>
        
        <div class="field">
            <label>Отображаемое имя</label>
            <input type="text" name="display_name" value="{{ profile.display_name }}">
        </div>
        <div class="field">
            <label>Место обитания</label>
            <input type="text" name="location" value="{{ profile.location or '' }}">
        </div>
        <div class="field">
            <label>Возраст</label>
            <input type="number" name="age" value="{{ profile.age or '' }}" min="14" max="100">
        </div>
        <div class="field">
            <label>О себе</label>
            <textarea name="bio">{{ profile.bio or '' }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Сохранить изменения</button>
    </form>
    
    <div class="section-divider"></div>
    
    <h3 class="settings-subtitle">Внешний вид</h3>
    <label class="checkbox-row">
        <input type="checkbox" id="themeToggle">
        <span>🌙 Тёмная тема</span>
    </label>
    
    <div class="section-divider"></div>
    
    <a href="{{ url_for('logout') }}" class="btn btn-ghost btn-block" style="color:var(--pink);border-color:var(--pink);">🚪 Выйти из аккаунта</a>
</div>

<script>
const themeToggle = document.getElementById('themeToggle');
const currentTheme = document.documentElement.getAttribute('data-theme');
themeToggle.checked = currentTheme === 'dark';

themeToggle.addEventListener('change', () => {
    const newTheme = themeToggle.checked ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
});
</script>
{% endblock %}
