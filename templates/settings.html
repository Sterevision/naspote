{% extends "base.html" %}
{% block title %}Настройки — На споте{% endblock %}
{% block content %}
<div class="list-page">
    <div class="page-head"><h2 class="display" style="font-size:24px;">⚙️ Настройки</h2></div>
    <form method="POST" enctype="multipart/form-data" class="card">
        <div class="field"><label>Ваше имя</label><input type="text" name="display_name" value="{{ profile.display_name }}"></div>
        <div class="field"><label>Где вы живёте</label><input type="text" name="location" value="{{ profile.location or '' }}" placeholder="Город"></div>
        <div class="field"><label>Возраст</label><input type="number" name="age" value="{{ profile.age or '' }}" min="7" max="100"></div>
        <div class="field"><label>О себе</label><textarea name="bio">{{ profile.bio or '' }}</textarea></div>
        <div class="field"><label>Фото</label><input type="file" name="avatar" accept="image/*"></div>
        <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
    </form>
    <a href="{{ url_for('profile_view', username=profile.username) }}" class="btn btn-soft btn-block" style="margin-top:12px;">← Готово</a>
</div>
{% endblock %}
