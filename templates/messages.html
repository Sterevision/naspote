{% extends "base.html" %}
{% block title %}Сообщения — На споте{% endblock %}
{% block content %}
<div class="list-page">
    <div class="page-head"><h2 class="display" style="font-size:24px;">💬 Сообщения</h2></div>
    <p class="subtitle">Выберите друга, чтобы написать</p>
    <div id="friendsList"><p class="hint">Загрузка...</p></div>
</div>
<script>
(async function () {
    var res = await fetch('/api/friends_list');
    var friends = await res.json();
    var box = document.getElementById('friendsList');
    box.innerHTML = friends.length ? friends.map(function (f) {
        return '<a class="row-card" href="/profile/' + f.username + '"><div class="avatar">' + (f.display_name || '?')[0].toUpperCase() + '</div><div class="info"><div class="name">' + f.display_name + '</div><div class="sub">Открыть профиль ✉️</div></div></a>';
    }).join('') : '<div class="empty-state"><div class="em">💬</div><p>Сначала добавьте друзей!</p></div>';
})();
</script>
{% endblock %}
