{% extends "base.html" %}

{% block title %}Чаты — Картометр{% endblock %}

{% block content %}
<div class="app-shell">
    <div class="list-page" style="flex:1; overflow-y:auto;">
        <div class="page-head">
            <div>
                <h1 class="display" style="font-size:24px; margin-bottom:6px;">
                    💬 Чаты
                </h1>

                <p class="subtitle">
                    Личные сообщения с друзьями
                </p>
            </div>
        </div>

        <div class="section-title">
            Диалоги
        </div>

        <div id="conversationsList">
            <div class="empty-state">
                <span class="em">⏳</span>
                <p>Загрузка...</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" href="{{ url_for('map_view') }}">
            <span class="ic">🗺️</span>
            Карта
        </a>

        <a class="nav-item" href="{{ url_for('feed_view') }}">
            <span class="ic">📰</span>
            Лента
        </a>

        <a class="nav-item" href="{{ url_for('friends_view') }}">
            <span class="ic">🤝</span>
            Друзья
        </a>

        <a class="nav-item active" href="{{ url_for('messages_view') }}">
            <span class="ic">💬</span>
            Чаты
        </a>

        <a class="nav-item" href="{{ url_for('profile_view', username=profile.username) }}">
            <span class="ic">👤</span>
            Профиль
        </a>
    </nav>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/messages.js') }}"></script>
{% endblock %}
